<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#090b12">
<title>CineLivre</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#fff;font:15px system-ui,Arial}
header{position:sticky;top:0;z-index:5;background:#090b12ee;border-bottom:1px solid #252c3c;padding:12px;display:flex;gap:12px;align-items:center}
.logo{font-size:20px;font-weight:900}.logo span{color:#e50914}
.sw{position:relative;flex:1}input{width:100%;background:#171d2b;border:1px solid #30394d;color:#fff;border-radius:10px;padding:11px;outline:none}
#sg{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#121725;border:1px solid #30394d;border-radius:12px;display:none;max-height:70vh;overflow:auto;z-index:9}
.it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid #252c3c;cursor:pointer}
.it img{width:40px;height:56px;object-fit:cover;border-radius:6px;background:#222}
.it b{display:block;font-size:14px}.it small,.m{color:#aab2c3}.m{padding:10px;font-size:13px}
main{padding:14px;max-width:1100px;margin:auto}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 0}
.chip{background:#171d2b;border:1px solid #252c3c;color:#dbe0eb;border-radius:30px;padding:8px 14px;white-space:nowrap}
.chip.on{background:#fff;color:#111}
button{border:0;border-radius:9px;padding:10px 15px;background:#e50914;color:#fff;font-weight:700}
button:disabled{opacity:.4}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){#grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){#grid{grid-template-columns:repeat(5,1fr)}}
.card{cursor:pointer;min-width:0}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#171d2b}
.card h3{font-size:14px;margin:7px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:#aab2c3}.pg{display:flex;gap:12px;justify-content:center;align-items:center;margin:22px 0}
#modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#box{background:#121725;border:1px solid #30394d;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:16px}
a.bt{display:inline-block;background:#e50914;color:#fff;padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:700;margin:4px 6px 4px 0}
a.bt.g{background:#293144}.ep{background:#1a2130;border-radius:10px;padding:10px;margin:6px 0;font-size:13px}
</style></head><body>
<header><div class="logo">CINE<span>LIVRE</span></div>
<div class="sw"><input id="q" type="search" placeholder="Pesquisar animes e filmes..." autocomplete="off"><div id="sg"></div></div></header>
<main>
<div class="chips" id="modes">
<button class="chip on" data-m="popular">Populares</button><button class="chip" data-m="movie">Filmes de anime</button><button class="chip" data-m="tv">Séries</button><button class="chip" data-m="ova">OVAs</button><button class="chip" data-m="special">Especiais</button></div>
<div class="chips" id="genres" style="display:none">
<button class="chip on" data-g="">Todos</button><button class="chip" data-g="1">Ação</button><button class="chip" data-g="2">Aventura</button><button class="chip" data-g="4">Comédia</button><button class="chip" data-g="8">Drama</button><button class="chip" data-g="10">Fantasia</button><button class="chip" data-g="22">Romance</button><button class="chip" data-g="24">Ficção científica</button><button class="chip" data-g="14">Terror</button><button class="chip" data-g="7">Mistério</button><button class="chip" data-g="36">Slice of Life</button><button class="chip" data-g="30">Esportes</button><button class="chip" data-g="37">Sobrenatural</button><button class="chip" data-g="46">Premiados</button></div>
<h2 id="title">Animes populares</h2>
<div id="grid"></div>
<div class="pg"><button id="prev">← Anterior</button><span id="pn">1</span><button id="next">Próxima →</button></div>
<p class="m">Catálogo de informações e capas (dados do MyAnimeList). Para assistir, use o botão "Onde assistir" de cada título.</p>
</main>
<div id="modal"><div id="box"></div></div>
<script>
const API="https://api.jikan.moe/v4",$=id=>document.getElementById(id);
let mode="popular",genre="",term="",page=1,sid=0,timer;
const names={popular:"Animes populares",movie:"Filmes de anime",tv:"Séries de anime",ova:"OVAs",special:"Especiais"};
function jf(u,ms){return Promise.race([fetch(u),new Promise((_,r)=>setTimeout(()=>r(new Error("Tempo esgotado")),ms||15000))])}
function ttl(a){return a.title_english||a.title||"Anime"}
function yr(a){return a.year||(a.aired&&a.aired.prop&&a.aired.prop.from&&a.aired.prop.from.year)||""}
function url(){
 if(term)return `${API}/anime?q=${encodeURIComponent(term)}&page=${page}&limit=20&sfw=true&order_by=members&sort=desc`;
 if(mode==="movie")return `${API}/anime?type=movie&order_by=members&sort=desc&sfw=true&page=${page}&limit=20${genre?"&genres="+genre:""}`;
 if(mode==="popular")return `${API}/top/anime?page=${page}&limit=20&filter=bypopularity`;
 return `${API}/top/anime?page=${page}&limit=20&type=${mode}&filter=bypopularity`;
}
async function load(){
 const g=$("grid");g.innerHTML='<p class="m">Carregando…</p>';$("pn").textContent="Página "+page;$("prev").disabled=page<=1;
 try{
  const r=await jf(url());
  if(r.status===429)throw new Error("Muitas buscas seguidas. Espere alguns segundos.");
  if(!r.ok)throw new Error("Não foi possível acessar o catálogo agora.");
  const j=await r.json(),items=j.data||[];
  $("next").disabled=!(j.pagination&&j.pagination.has_next_page);
  g.innerHTML="";
  if(!items.length){g.innerHTML='<p class="m">Nada encontrado.</p>';return}
  items.forEach(a=>{
   const c=document.createElement("div");c.className="card";
   const im=document.createElement("img");im.loading="lazy";im.alt=ttl(a);im.src=(a.images&&a.images.jpg&&(a.images.jpg.large_image_url||a.images.jpg.image_url))||"";
   const h=document.createElement("h3");h.textContent=ttl(a);
   const s=document.createElement("small");s.textContent=[a.type,yr(a),a.score?"★ "+a.score:""].filter(Boolean).join(" • ");
   c.append(im,h,s);c.onclick=()=>details(a);g.appendChild(c);
  });
 }catch(e){g.innerHTML="";const p=document.createElement("p");p.className="m";p.textContent=e.message+" Verifique a internet e tente de novo.";g.appendChild(p)}
}
function details(a){
 const b=$("box");b.innerHTML="";
 const x=document.createElement("button");x.textContent="Fechar ✕";x.style.cssText="float:right;background:#293144";x.onclick=()=>$("modal").style.display="none";
 const h=document.createElement("h2");h.textContent=ttl(a);
 const m=document.createElement("div");m.className="m";m.style.padding="0";m.textContent=[a.type,yr(a),a.episodes?a.episodes+" episódios":"",a.score?"Nota "+a.score:""].filter(Boolean).join(" • ");
 const p=document.createElement("p");p.style.color="#cbd3e2";p.textContent=a.synopsis||"Sinopse não disponível.";
 const w=document.createElement("a");w.className="bt";w.target="_blank";w.rel="noopener";w.textContent="Onde assistir";w.href="https://www.justwatch.com/br/busca?q="+encodeURIComponent(ttl(a));
 const f=document.createElement("a");f.className="bt g";f.target="_blank";f.rel="noopener";f.textContent="Ficha completa";f.href=a.url||"https://myanimelist.net";
 const eh=document.createElement("h3");eh.textContent="Episódios";
 const el=document.createElement("div");el.innerHTML='<p class="m">Carregando…</p>';
 b.append(x,h,m,p,w,f,eh,el);$("modal").style.display="flex";
 jf(`${API}/anime/${a.mal_id}/episodes`).then(r=>r.json()).then(j=>{
  el.innerHTML="";const e=j.data||[];
  if(!e.length){el.innerHTML='<p class="m">Sem lista de episódios.</p>';return}
  e.forEach(k=>{const d=document.createElement("div");d.className="ep";d.textContent="Ep. "+k.mal_id+": "+(k.title||"Sem título");el.appendChild(d)});
 }).catch(()=>{el.innerHTML='<p class="m">Não foi possível carregar os episódios.</p>'});
}
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").style.display="none"};
document.querySelectorAll("#modes .chip").forEach(b=>b.onclick=()=>{
 mode=b.dataset.m;term="";genre="";page=1;$("q").value="";
 document.querySelectorAll("#modes .chip").forEach(x=>x.classList.toggle("on",x===b));
 document.querySelectorAll("#genres .chip").forEach(x=>x.classList.toggle("on",x.dataset.g===""));
 $("genres").style.display=mode==="movie"?"flex":"none";$("title").textContent=names[mode];load();
});
document.querySelectorAll("#genres .chip").forEach(b=>b.onclick=()=>{
 genre=b.dataset.g;page=1;term="";
 document.querySelectorAll("#genres .chip").forEach(x=>x.classList.toggle("on",x===b));
 $("title").textContent="Filmes de anime"+(genre?": "+b.textContent:"");load();
});
$("prev").onclick=()=>{if(page>1){page--;load();scrollTo(0,0)}};
$("next").onclick=()=>{page++;load();scrollTo(0,0)};
function hide(){$("sg").style.display="none";$("sg").innerHTML=""}
function msg(t){const s=$("sg");s.innerHTML="";const d=document.createElement("div");d.className="m";d.textContent=t;s.appendChild(d);s.style.display="block"}
async function suggest(t){
 const my=++sid;msg("Buscando…");
 try{
  const r=await jf(`${API}/anime?q=${encodeURIComponent(t)}&limit=8&sfw=true&order_by=members&sort=desc`,12000);
  if(!r.ok)throw 0;const items=(await r.json()).data||[];
  if(my!==sid)return;if(!items.length){msg("Nenhum anime encontrado.");return}
  const s=$("sg");s.innerHTML="";
  items.forEach(a=>{
   const d=document.createElement("div");d.className="it";
   const im=document.createElement("img");im.src=(a.images&&a.images.jpg&&a.images.jpg.small_image_url)||"";
   const bx=document.createElement("div");const b=document.createElement("b");b.textContent=ttl(a);
   const sm=document.createElement("small");sm.textContent=[a.type,yr(a),a.score?"★ "+a.score:""].filter(Boolean).join(" • ");
   bx.append(b,sm);d.append(im,bx);d.onclick=()=>{hide();details(a)};s.appendChild(d);
  });
  const all=document.createElement("div");all.className="m";all.style.cssText="color:#ff7b83;font-weight:700;cursor:pointer";all.textContent="Ver todos os resultados";
  all.onclick=()=>{hide();full()};s.appendChild(all);s.style.display="block";
 }catch(e){if(my===sid)msg("Não foi possível buscar agora.")}
}
function full(){
 term=$("q").value.trim();page=1;
 document.querySelectorAll("#modes .chip").forEach(x=>x.classList.remove("on"));$("genres").style.display="none";
 $("title").textContent=term?"Resultados: "+term:names.popular;if(!term){mode="popular"}load();scrollTo(0,0);
}
$("q").addEventListener("input",()=>{clearTimeout(timer);const t=$("q").value.trim();if(t.length<2){sid++;hide();return}timer=setTimeout(()=>suggest(t),450)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){clearTimeout(timer);sid++;hide();full()}});
document.addEventListener("click",e=>{if(!e.target.closest(".sw"))hide()});
load();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
