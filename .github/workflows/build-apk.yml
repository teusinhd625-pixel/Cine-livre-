name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar arquivos do site
        run: |
          mkdir www
          cp ./*.html ./*.json ./*.js ./*.png www/ 2>/dev/null || true
          if [ ! -f www/index.html ]; then cp "$(ls www/*.html | head -1)" www/index.html; fi
          ls -la www

      - name: Criar projeto Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init CineLivre com.cinelivre.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CineLivre-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
